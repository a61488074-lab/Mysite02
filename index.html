<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aeris — Coming Soon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ---------- HEADER ---------- */

        header {
            width: 100%;
            text-align: center;
            padding-top: 25px;
        }

        .logo {
            width: 150px;
            height: auto;
            object-fit: contain;
        }

        /* ---------- MAIN ---------- */

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /*
            Futuristic machine
            This is intentionally blurred so the
            actual technology remains mysterious.
        */

        .machine {
            width: 330px;
            height: 210px;
            position: relative;
            filter: blur(9px);
            opacity: 0.72;
            transform: scale(1.05);
        }

        /* Main body */

        .machine-body {
            position: absolute;
            width: 270px;
            height: 135px;
            left: 30px;
            top: 35px;
            border: 2px solid #fff;
            border-radius: 24px;
            background:
                linear-gradient(
                    145deg,
                    #171717,
                    #050505
                );
            box-shadow:
                0 0 35px rgba(255,255,255,0.15);
        }

        /* Central core */

        .core {
            position: absolute;
            width: 70px;
            height: 70px;
            left: 100px;
            top: 67px;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow:
                0 0 20px rgba(255,255,255,0.4);
        }

        .core::after {
            content: "";
            position: absolute;
            width: 28px;
            height: 28px;
            left: 19px;
            top: 19px;
            border-radius: 50%;
            background: #fff;
            box-shadow:
                0 0 25px #fff;
        }

        /* Airflow lines */

        .air {
            position: absolute;
            height: 2px;
            background: #fff;
            border-radius: 50%;
        }

        .air.one {
            width: 100px;
            right: -5px;
            top: 62px;
            transform: rotate(-8deg);
        }

        .air.two {
            width: 125px;
            right: -25px;
            top: 85px;
            transform: rotate(2deg);
        }

        .air.three {
            width: 90px;
            right: 0;
            top: 108px;
            transform: rotate(9deg);
        }

        /* Small futuristic details */

        .detail {
            position: absolute;
            width: 35px;
            height: 4px;
            background: #fff;
            opacity: 0.8;
        }

        .detail.one {
            left: 28px;
            top: 22px;
        }

        .detail.two {
            left: 28px;
            top: 30px;
            width: 20px;
        }

        .detail.three {
            right: 35px;
            bottom: 20px;
            width: 40px;
        }

        /* ---------- TEXT ---------- */

        .coming {
            margin-top: 45px;
            font-size: 15px;
            letter-spacing: 7px;
            text-transform: uppercase;
            font-weight: 300;
            color: #fff;
        }

        .subtext {
            margin-top: 12px;
            font-size: 11px;
            letter-spacing: 3px;
            color: #777;
        }

        /* ---------- FOOTER ---------- */

        footer {
            text-align: center;
            padding: 22px;
            border-top: 1px solid #111;
            font-size: 10px;
            letter-spacing: 2px;
            color: #555;
        }

        /* ---------- MOBILE ---------- */

        @media (max-width: 600px) {

            .logo {
                width: 125px;
            }

            .machine {
                transform: scale(0.85);
            }

            .coming {
                font-size: 13px;
                letter-spacing: 5px;
            }

            .subtext {
                font-size: 9px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <img src="aeris-logo.png" alt="Aeris" class="logo">
    </header>


    <!-- MAIN CONTENT -->
    <main>

        <!-- Blurred futuristic machine -->
        <div class="machine">

            <div class="machine-body"></div>

            <div class="core"></div>

            <div class="air one"></div>
            <div class="air two"></div>
            <div class="air three"></div>

            <div class="detail one"></div>
            <div class="detail two"></div>
            <div class="detail three"></div>

        </div>

        <div class="coming">
            Coming Soon
        </div>

        <div class="subtext">
            A new approach to cooling
        </div>

    </main>


    <!-- FOOTER -->
    <footer>
        © 2026 AERIS
    </footer>

</body>
</html>
